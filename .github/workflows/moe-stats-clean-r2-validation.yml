name: MoE stats clean r2 validation

on:
  pull_request:
    branches:
      - feat/moe-transfer-stats-upstream-ready-r2

permissions:
  contents: read

jobs:
  clean-exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Bind clean parent and material blobs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'd6050358b7142c91f03737908b3c933d1bd2548b'
          test "$(git rev-parse HEAD:python/freetoken/server/api_server.py)" = '49789c13a9eadf9e29c90c26646c261ca763082c'
          test "$(git rev-parse HEAD:python/freetoken/server/stats.py)" = '69bba2c6b1263766bda9e999bbbb00b2fdf7bc50'
          test "$(git rev-parse HEAD:tests/server/test_moe_stats.py)" = '8818dc20fb73b3a58e42a878c8bc57e4eca93441'
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = '.github/workflows/moe-stats-clean-r2-validation.yml'
          echo 'CLEAN_PARENT_AND_BLOB_IDENTITY_PASS'

      - name: Install affected CPU test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            'apache-tvm-ffi==0.1.13.post3' \
            'partial-json-parser==0.2.1.1.post7' \
            'numpy>=2.0,<2.5' \
            'pyzmq>=27,<28' \
            'huggingface_hub>=1.5,<2' \
            'transformers>=5.5,<6' \
            'safetensors>=0.6,<1' \
            'tqdm>=4.66,<5' \
            'einops>=0.8,<1' \
            'msgpack>=1.1,<2' \
            'uvicorn>=0.30,<1' \
            'fastapi>=0.115,<1' \
            'openai>=2.0,<3'
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.11.0'
          python -m pip install --no-deps \
            'triton==3.6.0' \
            'flashlib==0.3.0'

      - name: Compile affected Python
        run: |
          python -m compileall -q \
            python/freetoken/server/api_server.py \
            python/freetoken/server/stats.py \
            tests/server/test_moe_stats.py

      - name: Run affected CPU regression
        env:
          PYTHONPATH: python
          TVM_FFI_CACHE_DIR: /tmp/freetoken-tvm-cache
        run: |
          python -m pytest -q \
            tests/scheduler \
            tests/server/test_message_wire.py \
            tests/server/test_moe_stats.py

      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
