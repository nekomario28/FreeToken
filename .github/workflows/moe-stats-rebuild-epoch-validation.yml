name: MoE stats rebuild epoch validation

on:
  pull_request:
    branches:
      - validation/moe-stats-rebuild-base

permissions:
  contents: read

jobs:
  rebuild-epoch-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Run rebuild epoch source regression
        run: python3 tests/server/test_moe_stats_rebuild_epoch_source.py
