name: AppImage r2 clean exact-head validation

on:
  pull_request:
    branches:
      - fix/appimage-installer-ld-library-path-upstream-ready-r2

permissions:
  contents: read

jobs:
  appimage-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 3

      - name: Bind ancestry and material blobs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '28005c80f221a3d7f289993e6035bb1a0c163919'
          test "$(git rev-parse HEAD^^)" = '2757bb5f91156fc8a44d88ec4b302a81f10c9e81'
          test "$(git rev-parse HEAD:install.sh)" = '008f058cb70c0969da03704f06e97583af71af49'
          test "$(git rev-parse HEAD:tests/install/test_install_script.py)" = 'e2c352800c0d48d13f53678a706b9edf017f3e3e'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/appimage-r2-clean-validation.yml'
          test "$(git ls-tree HEAD install.sh | awk '{print $1}')" = '100755'
          echo 'APPIMAGE_R2_IDENTITY_PASS'

      - name: Run installer child-environment regression
        run: python3 tests/install/test_install_script.py

      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
