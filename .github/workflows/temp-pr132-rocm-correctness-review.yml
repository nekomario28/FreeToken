name: TEMP PR132 ROCm correctness review validation

on:
  pull_request:
    branches:
      - fix/pr132-rocm-correctness-review

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 45417560beeba896a9b0866e50154d2a7a320b8b
      CANDIDATE_SHA: bbeb65e88201d23604bc6a4c489c881e686dd27a
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate integrated correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$BASE_SHA"

          expected=$'python/freetoken/kernel/_toolchain.py\npython/freetoken/kernel/csrc/include/freetoken/hip_compat.h\npython/freetoken/kernel/utils.py\nsetup.py\ntests/kernels/test_rocm_host_pointer_capability.py\ntests/kernels/test_rocm_runtime_link_cache.py\ntests/kernels/test_rocm_versioned_runtime_selection.py'
          test "$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)" = "$expected"
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"

          test "$(git rev-parse "$CANDIDATE_SHA:python/freetoken/kernel/csrc/include/freetoken/hip_compat.h")" = 3cb5feaf28a137915cad8d97f2874becbf6345af
          test "$(git rev-parse "$CANDIDATE_SHA:tests/kernels/test_rocm_host_pointer_capability.py")" = 2cf4a87eb907c5050978141f85a9dad62f8cacf8
          test "$(git rev-parse "$CANDIDATE_SHA:python/freetoken/kernel/_toolchain.py")" = e4065bf811d4195fdb45901042263e28f89f0318
          test "$(git rev-parse "$CANDIDATE_SHA:python/freetoken/kernel/utils.py")" = 533b122220429f61417d8e5400fba4e0478c9ea9
          test "$(git rev-parse "$CANDIDATE_SHA:tests/kernels/test_rocm_runtime_link_cache.py")" = fb1b47cbc121dbd1d578b9787cebdf0743b20258
          test "$(git rev-parse "$CANDIDATE_SHA:setup.py")" = 98ec6d74d398ac528b87bf6da1170290a2906faf
          test "$(git rev-parse "$CANDIDATE_SHA:tests/kernels/test_rocm_versioned_runtime_selection.py")" = 6266766ab2a0006091ef7138d678ff64ad6f53d5
          echo 'ROCM_CORRECTNESS_REVIEW_MATERIAL=EXACT_VALIDATED_BLOBS'

          python -m py_compile \
            python/freetoken/kernel/_toolchain.py \
            python/freetoken/kernel/utils.py \
            setup.py \
            tests/kernels/test_rocm_host_pointer_capability.py \
            tests/kernels/test_rocm_runtime_link_cache.py \
            tests/kernels/test_rocm_versioned_runtime_selection.py

          PYTHONPATH="$PWD/python" python tests/kernels/test_rocm_host_pointer_capability.py
          PYTHONPATH="$PWD/python" python tests/kernels/test_rocm_versioned_runtime_selection.py
          PYTHONPATH="$PWD/python" python tests/kernels/test_rocm_runtime_link_cache.py

          echo 'ROCM_CORRECTNESS_REVIEW=PASS_ALL_THREE_SOURCE_FILESYSTEM_CONTRACTS'
