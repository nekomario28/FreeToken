name: Pin budget r2 current-upstream validation

on:
  pull_request:
    branches:
      - tmp/pin-budget-r2-base

permissions:
  contents: write

# User-owned retrigger after the matrix persisted the exact two-file product composition.
jobs:
  source-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch prior validated regression
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 34aafd2ebd23483c1d657d2b0c858a1b1c87082a
          git checkout 34aafd2ebd23483c1d657d2b0c858a1b1c87082a -- tests/engine/test_pin_budget.py

      - name: Apply bounded current-upstream replay
        shell: bash
        run: python .github/validation/apply_pin_budget_r2.py

      - name: Verify intended product scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only HEAD -- python/freetoken/engine/engine.py tests/engine/test_pin_budget.py | sort)"
          if [ -z "$actual" ]; then
            echo 'PIN_BUDGET_R2_PRODUCT_ALREADY_COMMITTED'
          else
            expected="$(printf '%s\n' python/freetoken/engine/engine.py tests/engine/test_pin_budget.py | sort)"
            test "$actual" = "$expected"
            echo 'PIN_BUDGET_R2_PRODUCT_SCOPE_EXACT_TWO_FILES'
          fi

      - name: Compile product and regression
        shell: bash
        run: python -m py_compile python/freetoken/engine/engine.py tests/engine/test_pin_budget.py

      - name: Run source/Win32 API contract
        shell: bash
        run: python .github/validation/test_pin_budget_r2_source.py

      - name: Diff hygiene
        shell: bash
        run: git diff --check HEAD -- python/freetoken/engine/engine.py tests/engine/test_pin_budget.py

  persist-product:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Compose product bytes
        run: |
          set -euo pipefail
          git fetch origin 34aafd2ebd23483c1d657d2b0c858a1b1c87082a
          git checkout 34aafd2ebd23483c1d657d2b0c858a1b1c87082a -- tests/engine/test_pin_budget.py
          python .github/validation/apply_pin_budget_r2.py

      - name: Persist only engine plus regression
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          files=(python/freetoken/engine/engine.py tests/engine/test_pin_budget.py)
          if git diff --quiet HEAD -- "${files[@]}"; then
            echo 'product composition already committed; validation-only rerun'
            exit 0
          fi
          actual="$(git diff --name-only HEAD -- "${files[@]}" | sort)"
          expected="$(printf '%s\n' "${files[@]}" | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'fix(engine): detect native Windows pin budget'
          git push origin "HEAD:${HEAD_BRANCH}"
