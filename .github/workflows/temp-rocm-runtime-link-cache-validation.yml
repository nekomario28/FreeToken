name: TEMP ROCm runtime-link cache validation

on:
  pull_request:
    branches:
      - fix/pr132-rocm-runtime-link-cache

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE_SHA: 45417560beeba896a9b0866e50154d2a7a320b8b
      CANDIDATE_SHA: 2ccee21c1298377f7c6c211e44165f60c3039f7f
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify runtime-link cache source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^^")" = "$BASE_SHA"

          python -m py_compile tests/kernels/test_rocm_runtime_link_cache.py
          python tests/kernels/test_rocm_runtime_link_cache.py

          test "$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)" = $'python/freetoken/kernel/utils.py\ntests/kernels/test_rocm_runtime_link_cache.py'
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"

          grep -Fq 'cache_key = hashlib.sha256(str(runtime_target).encode("utf-8")).hexdigest()[:16]' python/freetoken/kernel/utils.py
          grep -Fq 'rocm-lib" / cache_key' python/freetoken/kernel/utils.py
          echo 'ROCM_RUNTIME_LINK_CACHE_CANDIDATE_DIFF=EXACT_TWO_FILES'
