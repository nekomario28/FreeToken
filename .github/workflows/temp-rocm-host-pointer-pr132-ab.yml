name: TEMP PR132 ROCm host-pointer A-B

on:
  pull_request:
    branches:
      - fix/pr132-rocm-host-pointer-capability

permissions:
  contents: read

jobs:
  discriminate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE_SHA: 45417560beeba896a9b0866e50154d2a7a320b8b
      CANDIDATE_SHA: 95e463c2cf35f29188ac2b0dc17c29a49c2dc3b6
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove base red and candidate green
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^^")" = "$BASE_SHA"

          base_root="$RUNNER_TEMP/base"
          candidate_root="$RUNNER_TEMP/candidate"
          git worktree add --detach "$base_root" "$BASE_SHA"
          git worktree add --detach "$candidate_root" "$CANDIDATE_SHA"
          mkdir -p "$base_root/tests/kernels"
          cp "$candidate_root/tests/kernels/test_rocm_host_pointer_capability.py" "$base_root/tests/kernels/test_rocm_host_pointer_capability.py"

          set +e
          python "$base_root/tests/kernels/test_rocm_host_pointer_capability.py" >"$RUNNER_TEMP/base.log" 2>&1
          base_rc=$?
          set -e
          test "$base_rc" -ne 0
          grep -Fq 'AssertionError' "$RUNNER_TEMP/base.log"
          echo "ROCM_HOST_POINTER_PR132_BASE_RC=$base_rc"
          echo 'ROCM_HOST_POINTER_PR132_BASE=EXPECTED_FAIL'

          python "$candidate_root/tests/kernels/test_rocm_host_pointer_capability.py"
          echo 'ROCM_HOST_POINTER_PR132_CANDIDATE=PASS'

          test "$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)" = $'python/freetoken/kernel/csrc/include/freetoken/hip_compat.h\ntests/kernels/test_rocm_host_pointer_capability.py'
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          echo 'ROCM_HOST_POINTER_PR132_AB=BASE_RED_FIX_GREEN'
