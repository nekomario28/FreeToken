name: AppImage installer candidate validation

on:
  pull_request:
    branches:
      - validation/appimage-ld-base

permissions:
  contents: read

jobs:
  installer-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Run installer child-environment regression
        run: python3 tests/install/test_install_script.py
