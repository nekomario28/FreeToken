name: Telemetry r3 current-upstream composition

on:
  pull_request:
    branches:
      - tmp/telemetry-r3-base

permissions:
  contents: write

jobs:
  compose-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Restore validated non-overlap telemetry bytes
        run: |
          set -euo pipefail
          git fetch origin d6050358b7142c91f03737908b3c933d1bd2548b
          git checkout d6050358b7142c91f03737908b3c933d1bd2548b -- \
            python/freetoken/control_cli.py \
            python/freetoken/message/frontend.py \
            python/freetoken/message/tokenizer.py \
            python/freetoken/moe/offload_cache.py \
            python/freetoken/scheduler/status.py \
            python/freetoken/tokenizer/server.py \
            tests/scheduler/test_abort_inflight_prefill.py \
            tests/scheduler/test_scheduler_status.py \
            tests/server/test_message_wire.py \
            tests/server/test_moe_stats.py

      - name: Apply bounded overlap replay onto current upstream
        run: python3 .github/validation/apply_telemetry_r3.py

      - name: Verify product scope
        run: |
          set -euo pipefail
          actual="$(git diff --name-only HEAD | sort)"
          if [ -z "$actual" ]; then
            echo 'TELEMETRY_R3_PRODUCT_ALREADY_COMMITTED'
            exit 0
          fi
          expected="$(printf '%s\n' \
            docs/cli.md \
            python/freetoken/control_cli.py \
            python/freetoken/message/frontend.py \
            python/freetoken/message/tokenizer.py \
            python/freetoken/moe/offload_cache.py \
            python/freetoken/scheduler/scheduler.py \
            python/freetoken/scheduler/status.py \
            python/freetoken/server/api_server.py \
            python/freetoken/server/args.py \
            python/freetoken/server/stats.py \
            python/freetoken/tokenizer/server.py \
            tests/scheduler/test_abort_inflight_prefill.py \
            tests/scheduler/test_scheduler_status.py \
            tests/server/test_message_wire.py \
            tests/server/test_moe_stats.py | sort)"
          test "$actual" = "$expected"
          echo 'TELEMETRY_R3_PRODUCT_SCOPE_EXACT_15_FILES'

      - name: Install affected CPU test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            'apache-tvm-ffi==0.1.13.post3' \
            'partial-json-parser==0.2.1.1.post7' \
            'numpy>=2.0,<2.5' \
            'pyzmq>=27,<28' \
            'huggingface_hub>=1.5,<2' \
            'transformers>=5.5,<6' \
            'safetensors>=0.6,<1' \
            'tqdm>=4.66,<5' \
            'einops>=0.8,<1' \
            'msgpack>=1.1,<2' \
            'uvicorn>=0.30,<1' \
            'fastapi>=0.115,<1' \
            'openai>=2.0,<3'
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.11.0'
          python -m pip install --no-deps \
            'triton==3.6.0' \
            'flashlib==0.3.0'

      - name: Compile affected Python
        run: |
          python -m compileall -q \
            python/freetoken/control_cli.py \
            python/freetoken/message/frontend.py \
            python/freetoken/message/tokenizer.py \
            python/freetoken/moe/offload_cache.py \
            python/freetoken/scheduler/scheduler.py \
            python/freetoken/scheduler/status.py \
            python/freetoken/server/api_server.py \
            python/freetoken/server/args.py \
            python/freetoken/server/stats.py \
            python/freetoken/tokenizer/server.py \
            tests/server/test_moe_stats.py

      - name: Run affected CPU regression
        env:
          PYTHONPATH: python
          TVM_FFI_CACHE_DIR: /tmp/freetoken-tvm-cache
        run: |
          python -m pytest -q \
            tests/scheduler \
            tests/server/test_message_wire.py \
            tests/server/test_moe_stats.py \
            tests/server/test_generation_accounting.py

      - name: Diff hygiene
        run: git diff --check HEAD

      - name: Persist only validated telemetry product changes
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          files=(
            docs/cli.md
            python/freetoken/control_cli.py
            python/freetoken/message/frontend.py
            python/freetoken/message/tokenizer.py
            python/freetoken/moe/offload_cache.py
            python/freetoken/scheduler/scheduler.py
            python/freetoken/scheduler/status.py
            python/freetoken/server/api_server.py
            python/freetoken/server/args.py
            python/freetoken/server/stats.py
            python/freetoken/tokenizer/server.py
            tests/scheduler/test_abort_inflight_prefill.py
            tests/scheduler/test_scheduler_status.py
            tests/server/test_message_wire.py
            tests/server/test_moe_stats.py
          )
          if git diff --quiet HEAD -- "${files[@]}"; then
            echo 'product composition already committed; validation-only rerun'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'feat(moe): expose decode cache telemetry on current upstream'
          git push origin "HEAD:${HEAD_BRANCH}"
