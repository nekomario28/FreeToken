name: File-backed FTW bounded source identity v0.10

on:
  push:
    branches:
      - research/file-backed-ftw-bounded-source-identity-v10-20260904
    paths:
      - "python/freetoken/experimental/file_backed_ftw_cpu_server.py"
      - "python/freetoken/experimental/file_backed_ftw_runtime_identity.py"
      - "python/freetoken/checkpoint/mapped_ftw_core.py"
      - "tests/experimental/test_file_backed_ftw_runtime_identity.py"
      - ".github/workflows/file-backed-ftw-bounded-source-identity-v10.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0

      - name: Confirm exact clean head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Compile bounded source identity surface
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            python/freetoken/experimental/file_backed_ftw_cpu_server.py \
            python/freetoken/experimental/file_backed_ftw_runtime_identity.py \
            tests/experimental/test_file_backed_ftw_runtime_identity.py

      - name: Run deterministic bounded source identity tests
        shell: bash
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s tests/experimental \
            -p 'test_file_backed_ftw_runtime_identity.py' \
            -v

      - name: Confirm live producer seals fixed owner source root
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          source_path = Path("python/freetoken/experimental/file_backed_ftw_runtime_identity.py")
          tree = ast.parse(source_path.read_text(encoding="utf-8"), filename=str(source_path))
          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          register = functions["register_runtime_identity_route"]
          calls = [
              node
              for node in ast.walk(register)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == "compute_bounded_software_identity"
          ]
          assert len(calls) == 1, calls
          assert not calls[0].args and not calls[0].keywords, ast.dump(calls[0])

          server_text = Path("python/freetoken/experimental/file_backed_ftw_cpu_server.py").read_text(encoding="utf-8")
          for forbidden in (
              "--source-root",
              "--source-digest",
              "--source-sha",
              "FREETOKEN_SOURCE_ROOT",
              "FREETOKEN_SOURCE_DIGEST",
          ):
              assert forbidden not in server_text, forbidden
          print("FIXED_OWNER_SOURCE_PRODUCER_PASS")
          PY

      - name: Emit exact bounded source identity receipt
        shell: bash
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from freetoken.experimental.file_backed_ftw_runtime_identity import (
              SCHEMA_VERSION,
              compute_bounded_software_identity,
          )
          identity = compute_bounded_software_identity()
          print("OWNER_RUNTIME_IDENTITY_SCHEMA=" + SCHEMA_VERSION)
          print("BOUNDED_SOURCE_IDENTITY_JSON=" + json.dumps(identity, sort_keys=True, separators=(",", ":")))
          PY

      - name: Confirm worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          echo "FILE_BACKED_FTW_BOUNDED_SOURCE_IDENTITY_V10_PASS sha=$(git rev-parse HEAD)"
