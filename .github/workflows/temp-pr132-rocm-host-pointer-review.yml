name: TEMP PR132 ROCm host-pointer review

on:
  pull_request:
    branches:
      - fix/pr132-rocm-host-pointer-review

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 45417560beeba896a9b0866e50154d2a7a320b8b
      CANDIDATE_SHA: 517b8ca90b2c66739113c84efd1cd90df65dcce6
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate one-change host-pointer candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$BASE_SHA"

          expected=$'python/freetoken/kernel/csrc/include/freetoken/hip_compat.h\ntests/kernels/test_rocm_host_pointer_capability.py'
          test "$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)" = "$expected"
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"

          test "$(git rev-parse "$CANDIDATE_SHA:python/freetoken/kernel/csrc/include/freetoken/hip_compat.h")" = 3cb5feaf28a137915cad8d97f2874becbf6345af
          test "$(git rev-parse "$CANDIDATE_SHA:tests/kernels/test_rocm_host_pointer_capability.py")" = 2cf4a87eb907c5050978141f85a9dad62f8cacf8
          echo 'ROCM_HOST_POINTER_REVIEW_MATERIAL=EXACT_VALIDATED_BLOBS'

          python -m py_compile tests/kernels/test_rocm_host_pointer_capability.py
          python tests/kernels/test_rocm_host_pointer_capability.py
          echo 'ROCM_HOST_POINTER_REVIEW=PASS_SOURCE_CONTRACT'
