name: Telemetry r3 clean exact-head validation

on:
  pull_request:
    branches:
      - feat/moe-transfer-stats-upstream-ready-r3

permissions:
  contents: read

jobs:
  clean-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 3

      - name: Bind clean ancestry and all material blobs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '40a01b8588b6e9f3da9a654cff782958424cc241'
          test "$(git rev-parse HEAD^^)" = '2757bb5f91156fc8a44d88ec4b302a81f10c9e81'
          test "$(git rev-parse HEAD:docs/cli.md)" = '8e85198023fed59d7d8c493aed3b12a124a1461c'
          test "$(git rev-parse HEAD:python/freetoken/control_cli.py)" = '1d0f08f32e1623c401e463bf4b0dab51349cb24e'
          test "$(git rev-parse HEAD:python/freetoken/message/frontend.py)" = '9c5dea63c6c082fddfcd5125225ff68388e7a9e3'
          test "$(git rev-parse HEAD:python/freetoken/message/tokenizer.py)" = '37cd63d9b934aefa7841033849f0ed409acea03b'
          test "$(git rev-parse HEAD:python/freetoken/moe/offload_cache.py)" = 'a7b05bff8db711f4cdddfcea69f7331308413d50'
          test "$(git rev-parse HEAD:python/freetoken/scheduler/scheduler.py)" = 'f76c356809f3a28349ac5c77b20a4d18e03d950e'
          test "$(git rev-parse HEAD:python/freetoken/scheduler/status.py)" = '74b17933c1fd91bdea7a6824dcce028db230bf9d'
          test "$(git rev-parse HEAD:python/freetoken/server/api_server.py)" = '58cafb05e47d4e65f8e27cdb25ee2965e98c1464'
          test "$(git rev-parse HEAD:python/freetoken/server/args.py)" = 'c6c183f223c5a9d1cf2b3b46739723db0e9d1e95'
          test "$(git rev-parse HEAD:python/freetoken/server/stats.py)" = 'a4a2aa66a00e6ddab71e5d845533cb1d584628f9'
          test "$(git rev-parse HEAD:python/freetoken/tokenizer/server.py)" = '5ae52abf23aafd60a9d0909bd763164500bde5fc'
          test "$(git rev-parse HEAD:tests/scheduler/test_abort_inflight_prefill.py)" = 'f2acd7122f12c1fe70347a21342b82ad78bf99ae'
          test "$(git rev-parse HEAD:tests/scheduler/test_scheduler_status.py)" = 'e1e29d7b9d310519c666d80fd93b831d54f9ced6'
          test "$(git rev-parse HEAD:tests/server/test_message_wire.py)" = '04138a8dd007ddfc192c50838f7f0d0cc6a630c5'
          test "$(git rev-parse HEAD:tests/server/test_moe_stats.py)" = '8818dc20fb73b3a58e42a878c8bc57e4eca93441'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/telemetry-r3-clean-validation.yml'
          grep -F '"gpus": list(getattr(state, "gpus", None) or [])' python/freetoken/server/stats.py
          grep -F 'gpus: List[Dict[str, Any]] = field(default_factory=list)' python/freetoken/server/api_server.py
          echo 'TELEMETRY_R3_CLEAN_IDENTITY_AND_GPU117_PRESERVATION_PASS'

      - name: Install affected CPU test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            'apache-tvm-ffi==0.1.13.post3' \
            'partial-json-parser==0.2.1.1.post7' \
            'numpy>=2.0,<2.5' \
            'pyzmq>=27,<28' \
            'huggingface_hub>=1.5,<2' \
            'transformers>=5.5,<6' \
            'safetensors>=0.6,<1' \
            'tqdm>=4.66,<5' \
            'einops>=0.8,<1' \
            'msgpack>=1.1,<2' \
            'uvicorn>=0.30,<1' \
            'fastapi>=0.115,<1' \
            'openai>=2.0,<3'
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.11.0'
          python -m pip install --no-deps \
            'triton==3.6.0' \
            'flashlib==0.3.0'

      - name: Compile affected Python
        run: |
          python -m compileall -q \
            python/freetoken/control_cli.py \
            python/freetoken/message/frontend.py \
            python/freetoken/message/tokenizer.py \
            python/freetoken/moe/offload_cache.py \
            python/freetoken/scheduler/scheduler.py \
            python/freetoken/scheduler/status.py \
            python/freetoken/server/api_server.py \
            python/freetoken/server/args.py \
            python/freetoken/server/stats.py \
            python/freetoken/tokenizer/server.py \
            tests/server/test_moe_stats.py

      - name: Run affected CPU regression
        env:
          PYTHONPATH: python
          TVM_FFI_CACHE_DIR: /tmp/freetoken-tvm-cache
        run: |
          python -m pytest -q \
            tests/scheduler \
            tests/server/test_message_wire.py \
            tests/server/test_moe_stats.py \
            tests/server/test_generation_accounting.py

      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
