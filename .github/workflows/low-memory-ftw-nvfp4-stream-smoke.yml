name: Low-memory FTW NVFP4 stream smoke

on:
  push:
    branches:
      - work/low-memory-ftw-nvfp4-stream-20260826
      - work/ftw-filebacked-runtime-integration-20260826
    paths:
      - "python/freetoken/checkpoint/low_memory_nvfp4.py"
      - "python/freetoken/checkpoint/ftw_filebacked.py"
      - "python/freetoken/checkpoint/mapped_ftw.py"
      - "python/freetoken/checkpoint/mapped_ftw_core.py"
      - "tests/models/test_nvfp4_low_memory_stream.py"
      - "tests/models/test_ftw_filebacked.py"
      - "tests/checkpoint/test_mapped_ftw.py"
      - "tests/checkpoint/test_mapped_ftw_core_stdlib.py"
      - ".github/workflows/low-memory-ftw-nvfp4-stream-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install minimal CPU test dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'safetensors>=0.6,<1' 'pytest>=8,<9'
      - name: Run affected synthetic tests
        run: |
          python -m py_compile \
            python/freetoken/checkpoint/low_memory_nvfp4.py \
            python/freetoken/checkpoint/ftw_filebacked.py \
            python/freetoken/checkpoint/mapped_ftw.py \
            python/freetoken/checkpoint/mapped_ftw_core.py \
            tests/models/test_nvfp4_low_memory_stream.py \
            tests/models/test_ftw_filebacked.py \
            tests/checkpoint/test_mapped_ftw.py \
            tests/checkpoint/test_mapped_ftw_core_stdlib.py
          PYTHONPATH=python pytest -q \
            tests/models/test_nvfp4_low_memory_stream.py \
            tests/models/test_ftw_filebacked.py \
            tests/checkpoint/test_mapped_ftw.py \
            tests/checkpoint/test_mapped_ftw_core_stdlib.py
