name: File-backed FTW CPU integration smoke

on:
  push:
    branches:
      - work/rocm-qwen35moe-filebacked-ftw-integration-20260826
    paths:
      - "python/freetoken/checkpoint/low_memory_nvfp4.py"
      - "python/freetoken/checkpoint/mapped_ftw_core.py"
      - "python/freetoken/checkpoint/mapped_ftw.py"
      - "python/freetoken/checkpoint/file_backed_ftw_cpu.py"
      - "python/freetoken/experimental/**"
      - "tests/models/test_nvfp4_low_memory_stream.py"
      - "tests/checkpoint/test_low_memory_nvfp4_ftw_bridge.py"
      - "tests/checkpoint/test_mapped_ftw_core_stdlib.py"
      - "tests/checkpoint/test_mapped_ftw_reclaim_stdlib.py"
      - "tests/checkpoint/test_mapped_ftw.py"
      - "tests/checkpoint/test_file_backed_ftw_cpu_server.py"
      - ".github/workflows/file-backed-ftw-cpu-integration-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install minimal CPU test dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'safetensors>=0.6,<1' 'pytest>=8,<9'
      - name: Run affected integration tests
        run: |
          python -m py_compile \
            python/freetoken/checkpoint/low_memory_nvfp4.py \
            python/freetoken/checkpoint/mapped_ftw_core.py \
            python/freetoken/checkpoint/mapped_ftw.py \
            python/freetoken/checkpoint/file_backed_ftw_cpu.py \
            python/freetoken/experimental/file_backed_ftw_cpu_server.py \
            tests/models/test_nvfp4_low_memory_stream.py \
            tests/checkpoint/test_low_memory_nvfp4_ftw_bridge.py \
            tests/checkpoint/test_mapped_ftw_core_stdlib.py \
            tests/checkpoint/test_mapped_ftw_reclaim_stdlib.py \
            tests/checkpoint/test_mapped_ftw.py \
            tests/checkpoint/test_file_backed_ftw_cpu_server.py
          pytest -q \
            tests/models/test_nvfp4_low_memory_stream.py \
            tests/checkpoint/test_low_memory_nvfp4_ftw_bridge.py \
            tests/checkpoint/test_mapped_ftw_core_stdlib.py \
            tests/checkpoint/test_mapped_ftw_reclaim_stdlib.py \
            tests/checkpoint/test_mapped_ftw.py \
            tests/checkpoint/test_file_backed_ftw_cpu_server.py
