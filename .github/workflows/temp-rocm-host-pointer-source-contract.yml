name: TEMP ROCm host-pointer source contract

on:
  pull_request:
    paths:
      - ".github/workflows/temp-rocm-host-pointer-source-contract.yml"
      - "python/freetoken/kernel/csrc/include/freetoken/hip_compat.h"
      - "tests/kernels/test_rocm_host_pointer_capability.py"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact candidate and source contract
        shell: bash
        env:
          CANDIDATE_SHA: e27fd026804987b065667c106a00868f91cc0063
          BASE_SHA: 48146760e6d2dfc92dd35233447c9602ad57054b
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "590477b00615f936cd24e18edebe29461f5d48db"
          test "$(git rev-parse 590477b00615f936cd24e18edebe29461f5d48db^)" = "$BASE_SHA"
          python -m py_compile tests/kernels/test_rocm_host_pointer_capability.py
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/kernels/test_rocm_host_pointer_capability.py')
          ns['test_rocm_host_pointer_capability_is_not_aliased_to_uva']()
          print('ROCM_HOST_POINTER_SOURCE_CONTRACT=PASS')
          PY
          test "$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)" = $'python/freetoken/kernel/csrc/include/freetoken/hip_compat.h\ntests/kernels/test_rocm_host_pointer_capability.py'
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          grep -Fq '#define cudaDevAttrCanUseHostPointerForRegisteredMem hipDeviceAttributeCanUseHostPointerForRegisteredMem' python/freetoken/kernel/csrc/include/freetoken/hip_compat.h
          ! grep -Fq '#define cudaDevAttrCanUseHostPointerForRegisteredMem hipDeviceAttributeUnifiedAddressing' python/freetoken/kernel/csrc/include/freetoken/hip_compat.h
          echo 'ROCM_HOST_POINTER_CANDIDATE_DIFF=EXACT_TWO_FILES'
