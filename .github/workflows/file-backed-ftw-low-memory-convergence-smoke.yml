name: File-backed FTW low-memory convergence smoke

on:
  push:
    branches:
      - work/file-backed-ftw-low-memory-convergence-20260826
    paths:
      - "python/freetoken/checkpoint/mapped_ftw_core.py"
      - "python/freetoken/checkpoint/mapped_ftw.py"
      - "python/freetoken/checkpoint/low_memory_nvfp4.py"
      - "tests/checkpoint/test_mapped_ftw_core_stdlib.py"
      - "tests/checkpoint/test_mapped_ftw.py"
      - "tests/checkpoint/test_nvfp4_low_memory_stream.py"
      - ".github/workflows/file-backed-ftw-low-memory-convergence-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Validate exact clean head and torch-free storage core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
          python3 -m py_compile python/freetoken/checkpoint/mapped_ftw_core.py
          python3 tests/checkpoint/test_mapped_ftw_core_stdlib.py -v
          test -z "$(git status --porcelain=v1)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'safetensors>=0.6,<1' 'pytest>=8,<9'
      - name: Validate torch adapter and one-layer converter primitive
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            python/freetoken/checkpoint/mapped_ftw.py \
            python/freetoken/checkpoint/low_memory_nvfp4.py \
            tests/checkpoint/test_mapped_ftw.py \
            tests/checkpoint/test_nvfp4_low_memory_stream.py
          pytest -q \
            tests/checkpoint/test_mapped_ftw.py \
            tests/checkpoint/test_nvfp4_low_memory_stream.py
          test -z "$(git status --porcelain=v1)"
